name: CI

on:
  push:
  pull_request:

jobs:
  java:
    name: Banking service (Java 17, Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
      - name: Run banking service tests
        working-directory: banking-service
        run: mvn -B test

  python:
    name: AI service (Python, stdlib tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run AI service tests
        working-directory: ai-service
        run: python -m unittest discover -s tests -v
