server.port=8080

# ---- Database: MySQL is the runtime database. ----
# Run MySQL yourself (see docker-compose.yml, which starts one) or point
# these at your own server. Tests do NOT use this: they run on H2 via
# src/test/resources/application.properties.
spring.datasource.url=jdbc:mysql://localhost:3306/bankai?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQL_USER:bankai}
spring.datasource.password=${MYSQL_PASSWORD:bankai}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ---- Demo auth (LOCAL DEMO ONLY, see README). ----
# Override with APP_DEMO_USERNAME / APP_DEMO_PASSWORD env vars. There is no
# external OAuth provider and no real credential anywhere in this repo.
app.demo.username=${APP_DEMO_USERNAME:demo}
app.demo.password=${APP_DEMO_PASSWORD:demo123}

# ---- CORS for the React dev server (demo-only). ----
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Event publishing: local publisher by default (no GCP setup needed).
# To use real Google Cloud Pub/Sub, set pubsub.enabled=true and provide
# PUBSUB_PROJECT_ID, PUBSUB_TOPIC, and PUBSUB_ACCESS_TOKEN.
pubsub.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false
